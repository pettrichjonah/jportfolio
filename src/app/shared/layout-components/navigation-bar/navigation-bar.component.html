<div id="nav-sentinel"></div>
@if (!(isMobile && isLandingPage())) {
	<nav [class.stuck]="isStuck" (click)="isStuck && scrollToTop()">
		@if (!isStuck) {
			@if (!isLandingPage()) {
				<a href="" (click)="$event.stopPropagation()"><p class="bordered-button" id="home-button" [class.stuck]="isStuck"><img id="home-icon" src="assets/icons/chevron-left.png" alt="Home Icon"></p></a>
			}
			<a [attr.href]="!isLandingPage() ? '' : null" id="headline" [class.stuck]="isStuck" (click)="!isLandingPage() && $event.stopPropagation()"><h3>{{ getCurrentRoute() }}</h3></a>
		} @else {
			<a id="headline" [class.stuck]="isStuck"><h3>{{ getCurrentRoute() }}</h3></a>
		}
		@if (isStuck) {
			<button (click)="$event.stopPropagation(); scrollToTop()" id="scroll-top-button"><img id="chevron-icon" src="assets/icons/chevron-up.png" alt="Chevron Up Icon"></button>
		}
	</nav>
}
